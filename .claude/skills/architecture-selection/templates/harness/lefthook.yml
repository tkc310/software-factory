# 手元のコミットを止める。--no-verify で回避できるので、CI の代わりにはならない。
pre-commit:
  # 整形(stage_fixed で書き戻す)が終わってから lint を掛けるため、順に実行する
  piped: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,md,css}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint {staged_files}
    deps:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm exec depcruise --config .dependency-cruiser.cjs {staged_files}

# フックから呼ぶ make では、値を渡す変数(pkg、name、args)を空にする。make のコマンド行の変数は
# MAKEFLAGS で入れ子の make に引き継がれるので、make のターゲットの中から git push すると、その値が検査に渡る。
pre-push:
  commands:
    check:
      run: make check pkg= name= args=
