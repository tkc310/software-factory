name: 改善提案
description: 使っていて気づいた不便、不具合、文言の違和感、開発の手順の困りごとを伝える
labels: [improvement]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が困ったか
      description: どの機能や手順で、何がどう困ったか。feature の名前で書く
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 種類
      description: 優先度の判断に使う(上ほど優先)
      options:
        - データを失う・壊す
        - 設計のルールの破れ
        - 成果物の品質
        - 開発体験(コマンド、検査、文書、エージェントの手順)
        - 見た目の好み
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: こうなるとよい
  - type: textarea
    id: prevent
    attributes:
      label: 再発防止の案(任意)
      description: 設計、型、依存ルール、lint、テスト、フック、文書のどれで防げそうか
